  <rect x="850" y="171" width="191.4" height="8" rx="2" class="m"/><rect x="850" y="183" width="188.3" height="8" rx="2" class="l"/><text x="1048" y="179" class="value">136.75</text><text x="1045" y="191" class="value">134.48</text>
